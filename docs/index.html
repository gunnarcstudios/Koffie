<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F1E9">
<title>Wie haalt er koffie?</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#F8F1E9;color:#3B2416;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
h1{margin:14px 0 6px;font-size:28px;font-weight:800;color:#6F4E37;text-align:center}
h2{margin:0 0 10px;font-size:16px}
h3{margin:18px 0 6px;font-size:14px}
.sub{margin:0 0 14px;text-align:center;color:#6B5B4E;font-size:16px}
.top{display:flex;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:#EFE2D2;color:#6F4E37;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:#fff;border-radius:18px;padding:16px;margin:0 0 12px}
.banner{background:#E8C9A0;border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:14px;font-weight:500}
label{display:block;font-size:13px;color:#6B5B4E;margin:10px 0 4px}
input,select{width:100%;height:48px;border:1px solid #A08E7E;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;color:#3B2416;font-family:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #A9714B;outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:30px;background:#6F4E37;color:#fff;font-size:17px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.big{min-height:60px;font-size:18px}
.btn.alt{background:transparent;border:1.5px solid #6F4E37;color:#6F4E37}
.btn.wa{background:#1B7F43}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:46px;font-size:15px}
.cup{font-size:96px;line-height:1;text-align:center;margin:26px 0 22px}
.hero{text-align:center;padding:22px 12px;border-radius:24px;margin:8px 0 6px}
.hero.win{background:#E8C9A0}
.hero.pop{animation:pop .5s ease-out}
.hero .big{font-size:42px;font-weight:800;color:#6F4E37;line-height:1.1;word-break:break-word;margin:4px 0}
.hero .em{font-size:56px;line-height:1.1}
.reel{font-size:40px;font-weight:800;color:#6F4E37;min-height:50px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;min-height:48px;padding:6px 14px;border:0;border-radius:24px;background:#E8C9A0;color:#3B2416;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.chip small{font-size:12px;font-weight:400;color:#4A3426}
.chip.off{background:#EFE2D2;color:#6B5B4E;text-decoration:line-through}
.chip.off small{color:#6B5B4E}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #EFE2D2}
.row:first-child{border-top:0}
.row.off .who{opacity:.55}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.who span{font-size:14px;color:#6B5B4E}
.who small{font-size:12px;color:#6B5B4E}
.sw{flex:none;width:52px;height:32px;border:0;border-radius:16px;background:#D9CBBB;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.sw.on{background:#6F4E37}
.sw.on::after{left:24px}
.x{flex:none;min-width:44px;min-height:44px;border:0;border-radius:22px;background:transparent;color:#6B5B4E;font-size:14px;cursor:pointer;font-family:inherit;padding:0 10px}
.x.arm{background:#F3D6CF;color:#7A1F10;font-weight:600}
.teamrow{flex:1;min-height:48px;border:0;border-radius:14px;background:#F8F1E9;text-align:left;padding:0 14px;font-size:16px;color:#3B2416;cursor:pointer;font-family:inherit}
.teamrow.cur{background:#E8C9A0}
.muted{color:#6B5B4E;font-size:14px;margin:6px 0}
.foot{text-align:center;color:#6B5B4E;font-size:12px;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#EFE2D2;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;height:76px;align-items:center}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;width:120px;border:0;background:transparent;color:#6B5B4E;font-size:12px;font-family:inherit;cursor:pointer}
nav button .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;font-size:20px}
nav button[aria-current=page]{color:#3B2416;font-weight:600}
nav button[aria-current=page] .ic{background:#E8C9A0}
.sheet{position:fixed;inset:0;background:rgba(59,36,22,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.panel{background:#F8F1E9;width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hero.pop{animation:none}.sw::after{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><button type="button" class="pill" id="teamBtn" aria-haspopup="dialog">👥 <span id="teamName">Kies een team</span> ▾</button></div>
  <div class="banner" id="banner" hidden></div>

  <section id="tab-loten">
    <h1>Wie haalt er koffie?</h1>
    <div id="lotenBody"></div>
  </section>

  <section id="tab-team" hidden>
    <h1>Team</h1>
    <p class="sub" id="teamSub"></p>
    <div class="card">
      <h2>Mijn gegevens</h2>
      <form id="meForm" autocomplete="off">
        <label for="jname">Jouw naam</label>
        <input id="jname" maxlength="30" required>
        <label for="jdrink">Wat wil je drinken?</label>
        <select id="jdrink"></select>
        <label for="jnote">Opmerking (melk, suiker…)</label>
        <input id="jnote" maxlength="40">
        <button class="btn" type="submit" id="jsubmit">Toevoegen</button>
      </form>
      <p class="muted" id="meMsg" aria-live="polite"></p>
    </div>
    <div class="card">
      <h2>Teamleden <span class="muted" id="count"></span></h2>
      <div id="memberList"></div>
    </div>
    <div class="card" id="inviteCard">
      <h2>Collega's uitnodigen</h2>
      <p class="muted">Stuur de link. Iedereen met de app of een browser (Android of iPhone) kan zo aansluiten.</p>
      <div id="inviteBox"></div>
    </div>
  </section>

  <p class="foot" id="status"></p>
</div>

<nav aria-label="Hoofdmenu"><div class="in">
  <button type="button" data-tab="loten" aria-current="page"><span class="ic">☕</span>Loten</button>
  <button type="button" data-tab="team"><span class="ic">👥</span>Team</button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <h2 id="sheetTitle">Mijn teams</h2>
    <div id="teamList"></div>
    <h3>Nieuw team maken</h3>
    <label for="newName">Naam van het team</label>
    <input id="newName" maxlength="40" placeholder="Bijv. Import" autocomplete="off">
    <button class="btn small" type="button" id="newTeam">Maak team</button>
    <h3>Aansluiten bij een team</h3>
    <label for="joinCode">Plak de link of code van je collega</label>
    <input id="joinCode" autocomplete="off" autocapitalize="off">
    <button class="btn alt small" type="button" id="joinTeam">Sluit aan</button>
    <p class="muted" id="sheetMsg" aria-live="polite"></p>
    <button class="btn alt small" type="button" id="closeSheet">Sluiten</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var NTFY = 'https://ntfy.sh';
  var DRINKS = ['Koffie', 'Cappuccino', 'Latte macchiato', 'Espresso', 'Thee', 'Warme chocolademelk', 'Water', 'Anders'];
  var ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';

  // ---------- hulpfuncties ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clean(s, n) { return String(s == null ? '' : s).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, n); }
  function fixDrink(d) {
    d = clean(d, 30);
    if (!d || d === 'Zwarte koffie') return 'Koffie';
    return d;
  }
  function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* negeren */ } }
  function randInt(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function uid() {
    return Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(8)), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }
  function newCode() { var s = ''; for (var i = 0; i < 10; i++) s += ALPHA[randInt(ALPHA.length)]; return s; }
  function plural(n) { return n; }

  // ---------- opgeslagen gegevens (per toestel) ----------
  var pid = null;
  try { pid = localStorage.getItem('kr_pid'); } catch (e) { pid = null; }
  if (!pid) { pid = uid(); try { localStorage.setItem('kr_pid', pid); } catch (e) { /* negeren */ } }
  var profile = load('kr_profile', null);        // {name, drink, note}
  if (profile) profile.drink = fixDrink(profile.drink);
  var teams = load('kr_teams', []);              // [{code, name}]
  var active = load('kr_active', null);

  // ---------- staat van het actieve team ----------
  var code = null, topic = null, es = null;
  var opened = false, demo = false, offline = false, heard = false;
  var room = null, members = new Map(), times = {}, seenDraw = {}, lastDraw = null, seen = new Set();
  var anim = null, lastAnimDid = null, popNow = false;
  var delArm = null, leaveArm = null, tab = 'loten';
  var syncTimer = null, demoTimer = null, cacheTimer = null, notFound = false;

  function setStatus(t) { $('status').textContent = t || ''; }
  function banner(t) { var b = $('banner'); if (t) { b.textContent = t; b.hidden = false; } else b.hidden = true; }

  // ---------- cache per team ----------
  function saveCache() {
    if (!code) return;
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(function () {
      save('kr_c_' + code, {
        name: room ? room.name : null,
        members: Array.from(members.values()),
        times: times,
        dids: Object.keys(seenDraw).slice(-40),
        last: lastDraw
      });
    }, 300);
  }
  function loadCache(c) {
    var d = load('kr_c_' + c, null);
    room = null; members = new Map(); times = {}; seenDraw = {}; lastDraw = null;
    if (!d) return false;
    if (d.name) room = { name: d.name };
    (d.members || []).forEach(function (m) {
      if (m && m.pid) members.set(m.pid, { pid: m.pid, name: clean(m.name, 30), drink: fixDrink(m.drink), note: clean(m.note, 40), present: m.present !== false });
    });
    times = d.times || {};
    (d.dids || []).forEach(function (x) { seenDraw[x] = 1; });
    lastDraw = d.last || null;
    return members.size > 0 || !!room;
  }

  function syncTeamName() {
    if (!room || !code) return;
    for (var i = 0; i < teams.length; i++) {
      if (teams[i].code === code && teams[i].name !== room.name) { teams[i].name = room.name; save('kr_teams', teams); }
    }
  }

  // ---------- events verwerken ----------
  function apply(ev, msgTime, live) {
    if (!ev || typeof ev !== 'object' || !ev.k || !ev.id || seen.has(ev.id)) return;
    seen.add(ev.id);
    switch (ev.k) {
      case 'room':
        heard = true;
        room = { name: clean(ev.name, 40) || 'Team' };
        syncTeamName();
        break;
      case 'snap':
        heard = true;
        if (!room) room = { name: clean(ev.name, 40) || 'Team' };
        (ev.m || []).forEach(function (a) {
          if (a && a[0] && !members.has(a[0])) {
            members.set(String(a[0]), { pid: String(a[0]), name: clean(a[1], 30), drink: fixDrink(a[2]), note: clean(a[3], 40), present: a[4] !== 0 });
          }
        });
        var t = ev.t || {};
        Object.keys(t).forEach(function (k) { times[k] = Math.max(times[k] || 0, Number(t[k]) || 0); });
        (ev.d || []).forEach(function (x) { seenDraw[x] = 1; });
        if (!lastDraw && ev.l) lastDraw = { did: ev.l[0], winner: ev.l[1], wname: clean(ev.l[2], 30), time: msgTime, order: [] };
        syncTeamName();
        break;
      case 'join': {
        if (!ev.pid || !clean(ev.name, 30)) break;
        heard = true;
        var old = members.get(ev.pid);
        members.set(String(ev.pid), {
          pid: String(ev.pid), name: clean(ev.name, 30), drink: fixDrink(ev.drink),
          note: clean(ev.note, 40), present: old ? old.present : true
        });
        break;
      }
      case 'leave':
        heard = true;
        members.delete(ev.pid);
        break;
      case 'present': {
        heard = true;
        var m = members.get(ev.pid);
        if (m) m.present = !!ev.v;
        break;
      }
      case 'draw': {
        heard = true;
        if (!seenDraw[ev.id]) {
          seenDraw[ev.id] = 1;
          times[ev.winner] = (times[ev.winner] || 0) + 1;
        }
        var d = {
          did: ev.id, winner: String(ev.winner), wname: clean(ev.wname, 30),
          order: Array.isArray(ev.order) ? ev.order.slice(0, 40).map(function (x) { return clean(x, 30); }) : [],
          time: msgTime
        };
        lastDraw = d;
        if (live && Math.abs(Date.now() / 1000 - msgTime) < 30) startAnim(d);
        break;
      }
    }
    saveCache();
    renderAll();
  }

  // ---------- netwerk ----------
  function postTo(t, ev) {
    fetch(NTFY + '/' + t, { method: 'POST', body: JSON.stringify(ev) })
      .then(function (r) { if (!r.ok) throw new Error('http'); })
      .catch(function () { setStatus('Versturen mislukt – controleer je verbinding'); });
  }
  function publish(ev) {
    ev.id = uid(); ev.by = pid;
    if (demo) { setTimeout(function () { apply(ev, Date.now() / 1000, true); }, 30); return; }
    postTo(topic, ev);
  }

  function connect() {
    setStatus('Verbinden…');
    opened = false; heard = false; offline = false;
    try { es = new EventSource(NTFY + '/' + topic + '/sse?since=all'); } catch (e) { failConnect(); return; }
    es.onopen = function () {
      opened = true; offline = false; banner('');
      try { localStorage.setItem('kr_ok', '1'); } catch (e) { /* negeren */ }
      setStatus('Verbonden ✓');
      clearTimeout(syncTimer); syncTimer = setTimeout(afterSync, 2200);
    };
    es.onmessage = function (m) {
      try {
        var d = JSON.parse(m.data);
        if (d.event !== 'message') return;
        apply(JSON.parse(d.message), d.time, true);
      } catch (e) { /* negeren */ }
    };
    es.onerror = function () {
      if (!opened) {
        if (!demoTimer) demoTimer = setTimeout(function () { demoTimer = null; if (!opened) failConnect(); }, 2500);
      } else setStatus('Verbinding herstellen…');
    };
  }

  function failConnect() {
    if (demo || offline) return;
    var everOk = false;
    try { everOk = !!localStorage.getItem('kr_ok'); } catch (e) { everOk = false; }
    if (everOk) {
      offline = true;
      banner('Geen verbinding. Je ziet de laatst bekende lijst; wijzigingen worden nu niet gedeeld.');
      setStatus('Offline');
      return;
    }
    goDemo();
  }

  function goDemo() {
    demo = true;
    if (es) { es.close(); es = null; }
    banner('Geen verbinding met de server. Dit is een voorbeeldmodus: alleen jij ziet dit op dit toestel.');
    setStatus('Voorbeeldmodus');
    var now = Date.now() / 1000;
    if (!room) apply({ k: 'room', id: uid(), name: 'Voorbeeldteam' }, now, false);
    if (!members.size) {
      [['d1', 'Sanne', 'Koffie', ''], ['d2', 'Mark', 'Cappuccino', 'havermelk'],
       ['d3', 'Lotte', 'Thee', 'zonder suiker'], ['d4', 'Kees', 'Koffie', '']].forEach(function (p) {
        apply({ k: 'join', id: uid(), pid: p[0], name: p[1], drink: p[2], note: p[3] }, now, false);
      });
    }
    ensureMe();
  }

  function afterSync() {
    if (demo || !code) return;
    if (!heard) {
      if (members.size || room) {
        // De server is het team vergeten (12 uur oud). Herstel het vanuit dit toestel.
        var m = Array.from(members.values()).map(function (x) { return [x.pid, x.name, x.drink, x.note, x.present ? 1 : 0]; });
        var snap = { k: 'snap', name: room ? room.name : 'Team', m: m, t: times, d: Object.keys(seenDraw).slice(-8),
                     l: lastDraw ? [lastDraw.did, lastDraw.winner, lastDraw.wname] : null };
        while (JSON.stringify(snap).length > 3800 && snap.m.length) { snap.m.pop(); }
        publish(snap);
      } else {
        notFound = true; renderAll();
      }
    }
    ensureMe();
  }

  function ensureMe() {
    if (!profile || !code) return;
    var m = members.get(pid);
    if (!m || m.name !== profile.name || m.drink !== profile.drink || m.note !== (profile.note || '')) {
      publish({ k: 'join', pid: pid, name: profile.name, drink: profile.drink, note: profile.note || '' });
    }
  }

  // ---------- teams ----------
  function teardown() {
    clearTimeout(syncTimer); clearTimeout(demoTimer); demoTimer = null;
    if (es) { es.close(); es = null; }
    demo = false; offline = false; opened = false; heard = false; notFound = false;
    anim = null; lastAnimDid = null; popNow = false; delArm = null;
    seen = new Set(); banner(''); setStatus('');
  }

  function openTeam(c, name) {
    if (!/^[a-z0-9]{6,20}$/.test(c)) return;
    teardown();
    code = c; topic = 'koffieronde-' + c;
    active = c; save('kr_active', c);
    var found = teams.filter(function (t) { return t.code === c; })[0];
    if (!found) { teams.push({ code: c, name: name || 'Team' }); save('kr_teams', teams); }
    loadCache(c);
    if (name && !room) room = { name: name };
    try { history.replaceState(null, '', '#' + c); } catch (e) { /* negeren */ }
    connect();
    renderAll();
  }

  function createTeam(name) {
    var c = newCode();
    var nm = clean(name, 40) || 'Team';
    teams.push({ code: c, name: nm }); save('kr_teams', teams);
    openTeam(c, nm);
    publish({ k: 'room', name: nm });
  }

  function leaveTeam(c) {
    var t = 'koffieronde-' + c;
    if (c === code && demo) { /* niets te melden */ } else postTo(t, { k: 'leave', id: uid(), by: pid, pid: pid });
    teams = teams.filter(function (x) { return x.code !== c; }); save('kr_teams', teams);
    try { localStorage.removeItem('kr_c_' + c); } catch (e) { /* negeren */ }
    if (c === code) {
      teardown(); code = null; topic = null; room = null; members = new Map(); times = {}; lastDraw = null;
      active = null; save('kr_active', null);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* negeren */ }
      if (teams.length) openTeam(teams[0].code);
    }
    renderAll();
  }

  function parseCode(text) {
    var s = String(text || '').trim().toLowerCase();
    var m = s.match(/#([a-z0-9]{6,20})\b/);
    if (m) return m[1];
    if (/^[a-z0-9]{6,20}$/.test(s)) return s;
    return null;
  }

  // ---------- loten ----------
  function presentList() { return Array.from(members.values()).filter(function (m) { return m.present; }); }

  function doDraw() {
    if (anim && !anim.done) return;
    var present = presentList();
    if (!present.length) return;
    var last = lastDraw ? lastDraw.winner : null;
    var pool = present.length > 1 ? present.filter(function (m) { return m.pid !== last; }) : present;
    var w = pool[randInt(pool.length)];
    var order = [], prev = -1;
    for (var i = 0; i < 22; i++) {
      var idx = randInt(present.length);
      if (idx === prev && present.length > 1) idx = (idx + 1) % present.length;
      order.push(present[idx].name); prev = idx;
    }
    order.push(w.name);
    publish({ k: 'draw', winner: w.pid, wname: w.name, order: order });
  }

  function startAnim(d) {
    if (lastAnimDid === d.did) return;
    lastAnimDid = d.did;
    if (anim && anim.timer) clearTimeout(anim.timer);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    anim = { did: d.did, order: d.order.length ? d.order : [d.wname], i: 0, done: false, timer: null };
    if (reduce) { anim.i = anim.order.length - 1; anim.done = true; return; }
    step();
  }
  function step() {
    if (!anim) return;
    if (anim.i >= anim.order.length - 1) { anim.done = true; popNow = true; renderLoten(); popNow = false; return; }
    renderLoten();
    var i = anim.i;
    anim.timer = setTimeout(function () { anim.i++; step(); }, 70 + i * i * 0.55);
  }

  // ---------- delen ----------
  function baseUrl() { return location.href.split('#')[0]; }
  function inviteUrl() { return baseUrl() + '#' + code; }
  function inviteText() { return 'Doe mee met team "' + (room ? room.name : 'Team') + '" in de koffieloting ☕ ' + inviteUrl(); }
  function listText() {
    var lines = [];
    if (lastDraw) { lines.push('Leukste collega: ' + lastDraw.wname + ' ☕'); lines.push(''); }
    lines.push('Koffielijst' + (room ? ' – ' + room.name : '') + ':');
    presentList().forEach(function (m) { lines.push(m.name + ': ' + m.drink + (m.note ? ' (' + m.note + ')' : '')); });
    return lines.join('\n');
  }
  function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }
  var canShare = typeof navigator.share === 'function';

  function copyText(text, btn, label) {
    function ok() { if (btn) { btn.textContent = 'Gekopieerd ✓'; setTimeout(function () { btn.textContent = label; }, 2000); } }
    try {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    } catch (e) { fallbackCopy(text); ok(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* negeren */ }
    document.body.removeChild(ta);
  }
  function nativeShare(text) { try { navigator.share({ text: text }).catch(function () {}); } catch (e) { /* negeren */ } }

  // ---------- weergave ----------
  function renderAll() {
    $('teamName').textContent = room && code ? room.name : (code ? 'Team' : 'Kies een team');
    renderLoten(); renderTeam(); renderSheet();
  }

  function renderLoten() {
    var el = $('lotenBody');
    if (!code) {
      el.innerHTML = '<p class="sub">Welkom! Maak een team of sluit aan bij het team van een collega.</p><div class="cup">☕</div>' +
        '<button class="btn big" type="button" data-act="sheet">Team kiezen of maken</button>';
      return;
    }
    if (notFound && !members.size) {
      el.innerHTML = '<p class="sub">Nog geen gegevens gevonden voor dit team.</p>' +
        '<p class="muted" style="text-align:center">Het team is mogelijk al 12 uur niet gebruikt. Vraag een collega die het team al heeft om het te openen, en probeer het daarna opnieuw.</p>' +
        '<button class="btn big" type="button" data-act="sheet">Ander team kiezen</button>';
      return;
    }
    var all = Array.from(members.values()), present = presentList();
    var h = '<p class="sub">' + present.length + ' van ' + all.length + ' collega\'s doen mee</p>';
    var animating = anim && !anim.done;
    if (animating) {
      h += '<div class="hero"><div>Wie haalt er koffie…?</div><div class="reel">' + esc(anim.order[anim.i]) + '</div></div>';
    } else if (lastDraw) {
      var counts = {};
      present.forEach(function (m) { counts[m.drink] = (counts[m.drink] || 0) + 1; });
      var lines = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })
        .map(function (k) { return '<li>' + counts[k] + '× ' + esc(k) + '</li>'; }).join('');
      var notes = present.filter(function (m) { return m.note; })
        .map(function (m) { return esc(m.name) + ': ' + esc(m.note); }).join(' · ');
      h += '<div class="hero win' + (popNow ? ' pop' : '') + '"><div class="em">🎉</div><div>Vandaag haalt…</div><div class="big">' +
        esc(lastDraw.wname) + '</div><div>koffie!</div></div>' +
        '<div class="card" style="margin-top:12px"><h2>Bestelling</h2><ul style="margin:0;padding:0;list-style:none;font-size:16px;line-height:1.6">' + lines + '</ul>' +
        (notes ? '<p class="muted">' + notes + '</p>' : '') + '</div>';
    } else {
      h += '<div class="cup">☕</div>';
    }
    h += '<button class="btn big" type="button" data-act="draw"' + (present.length && !animating ? '' : ' disabled') + '>' +
      (lastDraw ? 'Opnieuw loten' : 'Loot de koffiehaler!') + '</button>';
    if (present.length === 0) h += '<p class="muted" style="text-align:center">Er doet nog niemand mee. Voeg jezelf toe bij Team.</p>';

    if (lastDraw && !animating && present.length) {
      var txt = listText();
      h += '<a class="btn wa small" target="_blank" rel="noopener" href="' + waLink(txt) + '">Deel bestelling via WhatsApp</a>' +
        '<button class="btn alt small" type="button" data-act="copyList">Kopieer bestelling</button>' +
        (canShare ? '<button class="btn alt small" type="button" data-act="shareList">Deel op een andere manier</button>' : '');
    }

    h += '<div class="card" style="margin-top:16px"><h2>Kandidaten</h2>';
    if (all.length) {
      h += '<div class="chips">' + all.map(function (m) {
        return '<button type="button" class="chip' + (m.present ? '' : ' off') + '" data-pid="' + esc(m.pid) + '" aria-pressed="' + m.present + '">' +
          esc(m.name) + '<small>' + esc(m.drink) + (m.present ? '' : ' · doet niet mee') + '</small></button>';
      }).join('') + '</div><p class="muted">Tik op een naam om iemand uit of weer in te schakelen.</p>';
    } else h += '<p class="muted">Nog niemand. Voeg jezelf toe bij Team en nodig collega\'s uit.</p>';
    h += '</div>';
    el.innerHTML = h;
  }

  function renderTeam() {
    $('teamSub').textContent = code ? (room ? room.name : 'Team') : 'Kies eerst een team (bovenaan)';
    $('jsubmit').textContent = profile ? 'Opslaan' : 'Toevoegen';
    var all = Array.from(members.values());
    $('count').textContent = '· ' + all.filter(function (m) { return m.present; }).length + ' van ' + all.length + ' doen mee';
    if (!code) { $('memberList').innerHTML = '<p class="muted">Nog geen team gekozen.</p>'; $('inviteCard').hidden = true; return; }
    $('inviteCard').hidden = false;
    $('memberList').innerHTML = all.length ? all.map(function (m) {
      var n = times[m.pid] || 0;
      return '<div class="row' + (m.present ? '' : ' off') + '"><div class="who"><b>' + esc(m.name) + (m.pid === pid ? ' (jij)' : '') + '</b><span>' +
        esc(m.drink) + (m.note ? ' · ' + esc(m.note) : '') + '</span><small>' + n + '× gehaald</small></div>' +
        '<button type="button" class="sw' + (m.present ? ' on' : '') + '" data-pid="' + esc(m.pid) + '" role="switch" aria-checked="' + m.present +
        '" aria-label="Doet mee: ' + esc(m.name) + '"></button>' +
        '<button type="button" class="x' + (delArm === m.pid ? ' arm' : '') + '" data-del="' + esc(m.pid) + '" aria-label="Verwijder ' + esc(m.name) + '">' +
        (delArm === m.pid ? 'Zeker?' : '✕') + '</button></div>';
    }).join('') : '<p class="muted">Nog niemand in dit team.</p>';

    var inv = '<a class="btn wa small" target="_blank" rel="noopener" href="' + waLink(inviteText()) + '">Nodig uit via WhatsApp</a>' +
      '<button class="btn alt small" type="button" data-act="copyInvite">Kopieer link</button>' +
      (canShare ? '<button class="btn alt small" type="button" data-act="shareInvite">Deel op een andere manier</button>' : '') +
      '<h3>Lijst delen</h3><p class="muted">Stuurt de koffielijst' + (lastDraw ? ' met de leukste collega (' + esc(lastDraw.wname) + ') bovenaan' : '') + ' naar WhatsApp.</p>' +
      '<a class="btn wa small" target="_blank" rel="noopener" href="' + waLink(listText()) + '">Deel lijst via WhatsApp</a>' +
      '<button class="btn alt small" type="button" data-act="copyList">Kopieer lijst</button>';
    $('inviteBox').innerHTML = inv;
  }

  function renderSheet() {
    if ($('sheet').hidden) return;
    $('teamList').innerHTML = teams.length ? teams.map(function (t) {
      return '<div class="row"><button type="button" class="teamrow' + (t.code === code ? ' cur' : '') + '" data-open="' + esc(t.code) + '"><b>' + esc(t.name) +
        '</b>' + (t.code === code ? ' · actief' : '') + '</button><button type="button" class="x' + (leaveArm === t.code ? ' arm' : '') +
        '" data-leave="' + esc(t.code) + '" aria-label="Verlaat team ' + esc(t.name) + '">' + (leaveArm === t.code ? 'Zeker?' : 'Verlaat') + '</button></div>';
    }).join('') : '<p class="muted">Je zit nog in geen team.</p>';
  }

  function showTab(t) {
    tab = t;
    $('tab-loten').hidden = t !== 'loten';
    $('tab-team').hidden = t !== 'team';
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }
  function openSheet() { $('sheet').hidden = false; $('sheetMsg').textContent = ''; renderSheet(); $('sheetTitle').scrollIntoView(); }
  function closeSheet() { $('sheet').hidden = true; $('teamBtn').focus(); }

  // ---------- events van de pagina ----------
  $('jdrink').innerHTML = DRINKS.map(function (d) { return '<option>' + esc(d) + '</option>'; }).join('');
  if (profile) { $('jname').value = profile.name || ''; $('jdrink').value = profile.drink || 'Koffie'; $('jnote').value = profile.note || ''; }

  $('meForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = clean($('jname').value, 30);
    if (!name) return;
    profile = { name: name, drink: $('jdrink').value, note: clean($('jnote').value, 40) };
    save('kr_profile', profile);
    $('meMsg').textContent = code ? 'Opgeslagen ✓ – je collega\'s zien je gegevens.' : 'Opgeslagen ✓ – kies bovenaan een team om mee te doen.';
    ensureMe();
    renderAll();
  });

  $('newTeam').addEventListener('click', function () {
    var n = clean($('newName').value, 40);
    if (!n) { $('sheetMsg').textContent = 'Geef het team een naam.'; return; }
    $('newName').value = '';
    createTeam(n);
    closeSheet();
    showTab(profile ? 'loten' : 'team');
  });

  $('joinTeam').addEventListener('click', function () {
    var c = parseCode($('joinCode').value);
    if (!c) { $('sheetMsg').textContent = 'Dat lijkt geen geldige link of code.'; return; }
    $('joinCode').value = '';
    openTeam(c);
    closeSheet();
    showTab(profile ? 'loten' : 'team');
  });

  $('closeSheet').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  $('teamBtn').addEventListener('click', openSheet);

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-pid],[data-del],[data-open],[data-leave],[data-tab]');
    if (!t) return;
    var d = t.dataset;
    if (d.tab) { showTab(d.tab); return; }
    if (d.act === 'draw') doDraw();
    else if (d.act === 'sheet') openSheet();
    else if (d.act === 'copyList') copyText(listText(), t, t.textContent);
    else if (d.act === 'copyInvite') copyText(inviteUrl(), t, 'Kopieer link');
    else if (d.act === 'shareList') nativeShare(listText());
    else if (d.act === 'shareInvite') nativeShare(inviteText());
    else if (d.pid) {
      var m = members.get(d.pid);
      if (m) publish({ k: 'present', pid: m.pid, v: !m.present });
    } else if (d.del) {
      if (delArm === d.del) { publish({ k: 'leave', pid: d.del }); delArm = null; }
      else { delArm = d.del; renderTeam(); setTimeout(function () { if (delArm === d.del) { delArm = null; renderTeam(); } }, 3000); }
    } else if (d.open) {
      if (d.open !== code) openTeam(d.open);
      closeSheet(); showTab('loten');
    } else if (d.leave) {
      if (leaveArm === d.leave) { leaveArm = null; leaveTeam(d.leave); }
      else { leaveArm = d.leave; renderSheet(); setTimeout(function () { if (leaveArm === d.leave) { leaveArm = null; renderSheet(); } }, 3000); }
    }
  });

  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    if (/^[a-z0-9]{6,20}$/.test(h) && h !== code) openTeam(h);
  });

  // ---------- start ----------
  var h0 = location.hash.replace('#', '');
  if (/^[a-z0-9]{6,20}$/.test(h0)) openTeam(h0);
  else if (active && teams.some(function (t) { return t.code === active; })) openTeam(active);
  else renderAll();
  if (!profile) showTab(code ? 'team' : 'loten');
})();
</script>
</body>
</html>
