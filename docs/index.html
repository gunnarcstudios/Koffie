<!DOCTYPE html>
<html lang="nl">
<head>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#F8F1E9;color:#3B2416;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
h1{margin:10px 0 6px;font-size:28px;font-weight:800;color:#6F4E37;text-align:center}
h2{margin:0 0 10px;font-size:17px}
h3{margin:16px 0 8px;font-size:14px;color:#6B5B4E;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{margin:0 0 14px;text-align:center;color:#6B5B4E;font-size:16px}
.logo{display:block;margin:4px auto 8px;width:100%;max-width:150px;height:auto}
.logo.small{max-width:190px}
.card{background:#fff;border-radius:18px;padding:16px;margin:0 0 12px}
.banner{background:#E8C9A0;border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:14px;font-weight:500}
label{display:block;font-size:13px;color:#6B5B4E;margin:10px 0 4px}
input,select{width:100%;height:48px;border:1px solid #A08E7E;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;color:#3B2416;font-family:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #A9714B;outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:30px;background:#6F4E37;color:#fff;font-size:17px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.big{min-height:60px;font-size:18px}
.btn.alt{background:transparent;border:1.5px solid #6F4E37;color:#6F4E37}
.btn.wa{background:#1B7F43}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:46px;font-size:15px}
.mini{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1.5px solid #6F4E37;border-radius:22px;background:transparent;color:#6F4E37;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit}
.mini.wa{background:#1B7F43;border-color:#1B7F43;color:#fff}
.mini.arm{background:#F3D6CF;border-color:#F3D6CF;color:#7A1F10}
.mini.cur{background:#6F4E37;color:#fff}
.hero{text-align:center;padding:22px 12px;border-radius:24px;margin:8px 0 6px}
.hero.win{background:#E8C9A0}
.hero.pop{animation:pop .5s ease-out}
.hero .big{font-size:42px;font-weight:800;color:#6F4E37;line-height:1.1;word-break:break-word;margin:4px 0}
.hero .em{font-size:56px;line-height:1.1}
.reel{font-size:40px;font-weight:800;color:#6F4E37;min-height:50px;word-break:break-word}
.chips,.tchips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;min-height:48px;padding:6px 14px;border:0;border-radius:24px;background:#E8C9A0;color:#3B2416;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.chip small{font-size:12px;font-weight:400;color:#4A3426}
.chip.off{background:#EFE2D2;color:#6B5B4E;text-decoration:line-through}
.chip.off small{color:#6B5B4E}
.tchip{min-height:48px;padding:0 18px;border:1.5px solid #6F4E37;border-radius:24px;background:transparent;color:#6F4E37;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
.tchip.cur{background:#6F4E37;color:#fff}
.teamname{margin:0;font-size:20px;font-weight:700;color:#6F4E37}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #EFE2D2}
.row:first-child{border-top:0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.who span{font-size:14px;color:#6B5B4E}
.who small{font-size:12px;color:#6B5B4E}
.x{flex:none;min-width:44px;min-height:44px;border:0;border-radius:22px;background:transparent;color:#6B5B4E;font-size:15px;cursor:pointer;font-family:inherit;padding:0 10px}
.x.arm{background:#F3D6CF;color:#7A1F10;font-weight:600}
.trow{padding:12px 0;border-top:1px solid #EFE2D2}
.trow:first-child{border-top:0}
.trow b{font-size:17px}
.badge{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:12px;background:#E8C9A0;font-size:12px;font-weight:600}
.tmain{display:flex;align-items:center;gap:12px}
.radio{flex:none;width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.radio i{width:26px;height:26px;border:2.5px solid #6F4E37;border-radius:50%;display:block;position:relative}
.radio[aria-checked=true] i::after{content:"";position:absolute;inset:4px;background:#6F4E37;border-radius:50%}
.tname{flex:1;min-width:0;display:flex;flex-direction:column}
.tname small{font-size:12px;color:#6B5B4E}
.tname small.today{color:#3B2416;font-weight:600}
.more{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:22px;background:#EFE2D2;color:#6F4E37;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.tmenu{margin:6px 0 4px 56px;padding:4px 12px 12px;background:#F8F1E9;border-radius:14px}
.hint{margin:8px 0 0;padding:10px 12px;background:#F8F1E9;border-radius:12px;font-size:14px}
.muted{color:#6B5B4E;font-size:14px;margin:6px 0}
.foot{text-align:center;color:#6B5B4E;font-size:12px;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#EFE2D2;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;height:58px;align-items:center}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;width:33%;border:0;background:transparent;color:#6B5B4E;font-size:11px;font-family:inherit;cursor:pointer;padding:0}
nav button .ic{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
nav button .ic img{height:26px;width:auto;max-width:44px;display:block}
.sw{flex:none;width:52px;height:32px;border:0;border-radius:16px;background:#D9CBBB;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.sw.on{background:#6F4E37}
.sw.on::after{left:24px}
.row.off .who{opacity:.55}
.order{margin:0;padding:0;list-style:none;font-size:16px}
.order li{padding:8px 0;border-top:1px solid #EFE2D2}
.order li:first-child{border-top:0}
.order li span{display:block;font-size:14px;color:#6B5B4E;margin-top:2px}
nav button[aria-current=page]{color:#3B2416;font-weight:600}
nav button[aria-current=page] .ic{background:#E8C9A0}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hero.pop{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="banner" id="banner" hidden></div>

  <section id="tab-loten">
    <h1 class="sr">Wie haalt er koffie?</h1>
    <div id="lotenBody"></div>
  </section>

  <section id="tab-team" hidden>
    <img class="logo" src="img/team.png" alt="Team met koffie">
    <h1>Team</h1>
    <div class="card">
      <h2>Mijn teams</h2>
      <p class="muted">Kies met het rondje voor welk team je vandaag meedoet. Via Meer nodig je collega's uit of verwijder je een team.</p>
      <div id="myTeams" role="radiogroup" aria-label="Team voor vandaag"></div>
    </div>
    <div class="card">
      <h2>Nieuw team maken</h2>
      <label for="newName">Naam van het team</label>
      <input id="newName" maxlength="40" placeholder="Bijv: Administratie" autocomplete="off">
      <button class="btn small" type="button" id="newTeam">Maak team</button>
      <p class="muted" id="newMsg" aria-live="polite"></p>
    </div>
    <div class="card">
      <h2>Aansluiten bij een team</h2>
      <label for="joinCode">Plak de link of code van je collega hieronder</label>
      <input id="joinCode" autocomplete="off" autocapitalize="off">
      <button class="btn alt small" type="button" id="joinTeam">Sluit aan</button>
      <p class="muted" id="joinMsg" aria-live="polite"></p>
    </div>
    <div class="card" id="membersCard" hidden>
      <h2 id="membersTitle">Leden</h2>
      <div id="memberList"></div>
    </div>
  </section>

  <section id="tab-drinken" hidden>
    <img class="logo" src="img/drinken.png" alt="Mijn drinken">
    <h1 class="sr">Mijn drinken</h1>
    <p class="sub">Kies per team wat je wilt drinken.</p>
    <div class="card">
      <h2>Mijn naam</h2>
      <form id="nameForm" autocomplete="off">
        <label for="jname">Jouw naam</label>
        <input id="jname" maxlength="30" required>
        <button class="btn small" type="submit">Opslaan</button>
      </form>
      <p class="muted" id="nameMsg" aria-live="polite"></p>
    </div>
    <div id="drinkCards"></div>
  </section>

  <p class="foot" id="status"></p>
</div>

<nav aria-label="Hoofdmenu"><div class="in">
  <button type="button" data-tab="loten" aria-current="page"><span class="ic"><img src="img/loten-s.png" alt=""></span>Loten</button>
  <button type="button" data-tab="team"><span class="ic"><img src="img/team-s.png" alt=""></span>Team</button>
  <button type="button" data-tab="drinken"><span class="ic"><img src="img/drinken-s.png" alt=""></span>Mijn drinken</button>
</div></nav>

<script>
(function () {
  'use strict';

  var NTFY = 'https://ntfy.sh';
  var DRINKS = ['Koffie', 'Cappuccino', 'Latte macchiato', 'Espresso', 'Thee', 'Warme chocolademelk', 'Water', 'Anders'];
  var ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';

  // ---------- hulpfuncties ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clean(s, n) { return String(s == null ? '' : s).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, n); }
  function fixDrink(d) {
    d = clean(d, 30);
    if (!d || d === 'Zwarte koffie') return 'Koffie';
    return d;
  }
  function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* negeren */ } }
  function randInt(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function uid() {
    return Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(8)), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }
  function newCode() { var s = ''; for (var i = 0; i < 10; i++) s += ALPHA[randInt(ALPHA.length)]; return s; }
  function topicOf(c) { return 'koffieronde-' + c; }

  // ---------- opgeslagen gegevens (per toestel) ----------
  var pid = null;
  try { pid = localStorage.getItem('kr_pid'); } catch (e) { pid = null; }
  if (!pid) { pid = uid(); try { localStorage.setItem('kr_pid', pid); } catch (e) { /* negeren */ } }
  var profile = load('kr_profile', null);          // {name}
  var drinks = load('kr_drinks', {});              // {teamcode: {drink, note}}
  var lastDrink = load('kr_lastdrink', null);      // {drink, note}
  if (profile && profile.drink && !lastDrink) { lastDrink = { drink: fixDrink(profile.drink), note: clean(profile.note, 40) }; save('kr_lastdrink', lastDrink); }
  var teams = load('kr_teams', []);                // [{code, name}]
  var active = load('kr_active', null);          // laatst bekeken team
  var today = load('kr_today', null);            // team waarmee je vandaag meedoet
  if (!today && active && teams.some(function (t) { return t.code === active; })) { today = active; save('kr_today', today); }
  var menuOpen = null;

  function myDrink(c) { return drinks[c] || lastDrink || { drink: 'Koffie', note: '' }; }

  // ---------- staat van het actieve team ----------
  var code = null, topic = null, es = null;
  var opened = false, demo = false, offline = false, heard = false, forcePresent = false;
  var room = null, members = new Map(), times = {}, seenDraw = {}, lastDraw = null, seen = new Set();
  var anim = null, lastAnimDid = null, popNow = false;
  var delArm = null, rmArm = null, tab = 'loten';
  var syncTimer = null, demoTimer = null, cacheTimer = null, notFound = false;

  function setStatus(t) { $('status').textContent = t || ''; }
  function banner(t) { var b = $('banner'); if (t) { b.textContent = t; b.hidden = false; } else b.hidden = true; }

  // ---------- cache per team ----------
  function saveCache() {
    if (!code) return;
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(function () {
      save('kr_c_' + code, {
        name: room ? room.name : null,
        members: Array.from(members.values()),
        times: times,
        dids: Object.keys(seenDraw).slice(-40),
        last: lastDraw
      });
    }, 300);
  }
  function loadCache(c) {
    var d = load('kr_c_' + c, null);
    room = null; members = new Map(); times = {}; seenDraw = {}; lastDraw = null;
    if (!d) return false;
    if (d.name) room = { name: d.name };
    (d.members || []).forEach(function (m) {
      if (m && m.pid) members.set(m.pid, { pid: m.pid, name: clean(m.name, 30), drink: fixDrink(m.drink), note: clean(m.note, 40), present: m.present !== false });
    });
    times = d.times || {};
    (d.dids || []).forEach(function (x) { seenDraw[x] = 1; });
    lastDraw = d.last || null;
    return members.size > 0 || !!room;
  }

  function syncTeamName() {
    if (!room || !code) return;
    for (var i = 0; i < teams.length; i++) {
      if (teams[i].code === code && teams[i].name !== room.name) { teams[i].name = room.name; save('kr_teams', teams); }
    }
  }

  // ---------- events verwerken ----------
  function apply(ev, msgTime, live) {
    if (!ev || typeof ev !== 'object' || !ev.k || !ev.id || seen.has(ev.id)) return;
    seen.add(ev.id);
    switch (ev.k) {
      case 'room':
        heard = true;
        room = { name: clean(ev.name, 40) || 'Team' };
        syncTeamName();
        break;
      case 'snap':
        heard = true;
        if (!room) room = { name: clean(ev.name, 40) || 'Team' };
        (ev.m || []).forEach(function (a) {
          if (a && a[0] && !members.has(a[0])) {
            members.set(String(a[0]), { pid: String(a[0]), name: clean(a[1], 30), drink: fixDrink(a[2]), note: clean(a[3], 40), present: a[4] !== 0 });
          }
        });
        var t = ev.t || {};
        Object.keys(t).forEach(function (k) { times[k] = Math.max(times[k] || 0, Number(t[k]) || 0); });
        (ev.d || []).forEach(function (x) { seenDraw[x] = 1; });
        if (!lastDraw && ev.l) lastDraw = { did: ev.l[0], winner: ev.l[1], wname: clean(ev.l[2], 30), time: msgTime, order: [] };
        syncTeamName();
        break;
      case 'join': {
        if (!ev.pid || !clean(ev.name, 30)) break;
        heard = true;
        var old = members.get(ev.pid);
        members.set(String(ev.pid), {
          pid: String(ev.pid), name: clean(ev.name, 30), drink: fixDrink(ev.drink),
          note: clean(ev.note, 40), present: old ? old.present : (ev.p === false ? false : true)
        });
        break;
      }
      case 'leave':
        heard = true;
        members.delete(ev.pid);
        break;
      case 'present': {
        heard = true;
        var m = members.get(ev.pid);
        if (m) m.present = !!ev.v;
        break;
      }
      case 'draw': {
        heard = true;
        if (!seenDraw[ev.id]) {
          seenDraw[ev.id] = 1;
          times[ev.winner] = (times[ev.winner] || 0) + 1;
        }
        var d = {
          did: ev.id, winner: String(ev.winner), wname: clean(ev.wname, 30),
          order: Array.isArray(ev.order) ? ev.order.slice(0, 40).map(function (x) { return clean(x, 30); }) : [],
          time: msgTime
        };
        lastDraw = d;
        if (live && Math.abs(Date.now() / 1000 - msgTime) < 30) startAnim(d);
        break;
      }
    }
    saveCache();
    renderAll();
  }

  // ---------- netwerk ----------
  function postTo(t, ev) {
    fetch(NTFY + '/' + t, { method: 'POST', body: JSON.stringify(ev) })
      .then(function (r) { if (!r.ok) throw new Error('http'); })
      .catch(function () { setStatus('Versturen mislukt – controleer je verbinding'); });
  }
  function publish(ev) {
    ev.id = uid(); ev.by = pid;
    if (demo) { setTimeout(function () { apply(ev, Date.now() / 1000, true); }, 30); return; }
    postTo(topic, ev);
  }
  // Bericht naar een willekeurig team (ook als dat niet het actieve team is)
  function sendToTeam(c, ev) {
    if (c === code) { publish(ev); return; }
    if (demo) return;
    ev.id = uid(); ev.by = pid;
    postTo(topicOf(c), ev);
  }

  function connect() {
    setStatus('Verbinden…');
    opened = false; heard = false; offline = false;
    try { es = new EventSource(NTFY + '/' + topic + '/sse?since=all'); } catch (e) { failConnect(); return; }
    es.onopen = function () {
      opened = true; offline = false; banner('');
      try { localStorage.setItem('kr_ok', '1'); } catch (e) { /* negeren */ }
      setStatus('Verbonden ✓');
      clearTimeout(syncTimer); syncTimer = setTimeout(afterSync, 2200);
    };
    es.onmessage = function (m) {
      try {
        var d = JSON.parse(m.data);
        if (d.event !== 'message') return;
        apply(JSON.parse(d.message), d.time, true);
      } catch (e) { /* negeren */ }
    };
    es.onerror = function () {
      if (!opened) {
        if (!demoTimer) demoTimer = setTimeout(function () { demoTimer = null; if (!opened) failConnect(); }, 2500);
      } else setStatus('Verbinding herstellen…');
    };
  }

  function failConnect() {
    if (demo || offline) return;
    var everOk = false;
    try { everOk = !!localStorage.getItem('kr_ok'); } catch (e) { everOk = false; }
    if (everOk) {
      offline = true;
      banner('Geen verbinding. Je ziet de laatst bekende lijst; wijzigingen worden nu niet gedeeld.');
      setStatus('Offline');
      return;
    }
    goDemo();
  }

  function goDemo() {
    demo = true;
    if (es) { es.close(); es = null; }
    banner('Geen verbinding met de server. Dit is een voorbeeldmodus: alleen jij ziet dit op dit toestel.');
    setStatus('Voorbeeldmodus');
    var now = Date.now() / 1000;
    if (!room) apply({ k: 'room', id: uid(), name: 'Voorbeeldteam' }, now, false);
    if (!members.size) {
      [['d1', 'Sanne', 'Koffie', ''], ['d2', 'Mark', 'Cappuccino', 'havermelk'],
       ['d3', 'Lotte', 'Thee', 'zonder suiker'], ['d4', 'Kees', 'Koffie', '']].forEach(function (p) {
        apply({ k: 'join', id: uid(), pid: p[0], name: p[1], drink: p[2], note: p[3] }, now, false);
      });
    }
    afterSync();
  }

  function afterSync() {
    if (!code) return;
    if (!demo && !heard) {
      if (members.size || room) {
        // De server is het team vergeten (12 uur oud). Herstel het vanuit dit toestel.
        var m = Array.from(members.values()).map(function (x) { return [x.pid, x.name, x.drink, x.note, x.present ? 1 : 0]; });
        var snap = { k: 'snap', name: room ? room.name : 'Team', m: m, t: times, d: Object.keys(seenDraw).slice(-8),
                     l: lastDraw ? [lastDraw.did, lastDraw.winner, lastDraw.wname] : null };
        while (JSON.stringify(snap).length > 3800 && snap.m.length) { snap.m.pop(); }
        publish(snap);
      } else {
        notFound = true; renderAll();
      }
    }
    ensureMe();
    if (forcePresent) {
      var me = members.get(pid);
      if (me && !me.present && code === today) publish({ k: 'present', pid: pid, v: true });
      forcePresent = false;
    }
  }

  function joinEvent(c, newMemberPresent) {
    var d = myDrink(c);
    var ev = { k: 'join', pid: pid, name: profile.name, drink: d.drink, note: d.note || '' };
    if (newMemberPresent === false) ev.p = false;
    return ev;
  }

  function ensureMe() {
    if (!profile || !profile.name || !code) return;
    var d = myDrink(code), m = members.get(pid);
    if (!m || m.name !== profile.name || m.drink !== d.drink || m.note !== (d.note || '')) publish(joinEvent(code, code === today));
  }

  // ---------- teams ----------
  function teardown() {
    clearTimeout(syncTimer); clearTimeout(demoTimer); demoTimer = null;
    if (es) { es.close(); es = null; }
    demo = false; offline = false; opened = false; heard = false; notFound = false;
    anim = null; lastAnimDid = null; popNow = false; delArm = null;
    seen = new Set(); banner(''); setStatus('');
  }

  function openTeam(c, name) {
    if (!/^[a-z0-9]{6,20}$/.test(c)) return;
    teardown();
    code = c; topic = topicOf(c);
    active = c; save('kr_active', c);
    if (!teams.some(function (t) { return t.code === c; })) { teams.push({ code: c, name: name || 'Team' }); save('kr_teams', teams); }
    loadCache(c);
    if (name && !room) room = { name: name };
    connect();
    renderAll(); renderDrinks();
  }

  // Kies je team voor vandaag: in al je andere teams doe je dan automatisch niet mee.
  // (Alleen kijken naar een ander team via openTeam verandert hier niets aan.)
  function activateTeam(c, name) {
    today = c; save('kr_today', today);
    teams.forEach(function (t) {
      if (t.code !== c) sendToTeam(t.code, { k: 'present', pid: pid, v: false });
    });
    if (c === code) {
      var me = members.get(pid);
      if (me && !me.present) publish({ k: 'present', pid: pid, v: true });
      renderAll(); renderDrinks();
    } else {
      forcePresent = true;
      openTeam(c, name);
    }
  }

  function createTeam(name) {
    var c = newCode(), nm = clean(name, 40) || 'Team';
    activateTeam(c, nm);
    publish({ k: 'room', name: nm });
  }

  function removeTeam(c) {
    var wasView = c === code, wasToday = today === c;
    if (profile && !(demo && wasView)) sendToTeam(c, { k: 'leave', pid: pid });
    teams = teams.filter(function (x) { return x.code !== c; }); save('kr_teams', teams);
    delete drinks[c]; save('kr_drinks', drinks);
    try { localStorage.removeItem('kr_c_' + c); } catch (e) { /* negeren */ }
    if (wasView) {
      teardown(); code = null; topic = null; room = null; members = new Map(); times = {}; lastDraw = null;
      active = null; save('kr_active', null);
    }
    if (wasToday) { today = null; save('kr_today', null); }
    if (teams.length) {
      if (wasToday) activateTeam(teams[0].code);
      else if (wasView) openTeam(today && teams.some(function (t) { return t.code === today; }) ? today : teams[0].code);
    }
    menuOpen = null;
    renderAll(); renderDrinks();
  }

  function parseCode(text) {
    var s = String(text || '').trim().toLowerCase();
    var m = s.match(/#([a-z0-9]{6,20})\b/);
    if (m) return m[1];
    if (/^[a-z0-9]{6,20}$/.test(s)) return s;
    return null;
  }

  // ---------- loten ----------
  function presentList() { return Array.from(members.values()).filter(function (m) { return m.present; }); }

  function doDraw() {
    if (anim && !anim.done) return;
    var present = presentList();
    if (!present.length) return;
    var last = lastDraw ? lastDraw.winner : null;
    var pool = present.length > 1 ? present.filter(function (m) { return m.pid !== last; }) : present;
    var w = pool[randInt(pool.length)];
    var order = [], prev = -1;
    for (var i = 0; i < 22; i++) {
      var idx = randInt(present.length);
      if (idx === prev && present.length > 1) idx = (idx + 1) % present.length;
      order.push(present[idx].name); prev = idx;
    }
    order.push(w.name);
    publish({ k: 'draw', winner: w.pid, wname: w.name, order: order });
  }

  function startAnim(d) {
    if (lastAnimDid === d.did) return;
    lastAnimDid = d.did;
    if (anim && anim.timer) clearTimeout(anim.timer);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    anim = { did: d.did, order: d.order.length ? d.order : [d.wname], i: 0, done: false, timer: null };
    if (reduce) { anim.i = anim.order.length - 1; anim.done = true; return; }
    step();
  }
  function step() {
    if (!anim) return;
    if (anim.i >= anim.order.length - 1) { anim.done = true; popNow = true; renderLoten(); popNow = false; return; }
    renderLoten();
    var i = anim.i;
    anim.timer = setTimeout(function () { anim.i++; step(); }, 70 + i * i * 0.55);
  }

  // ---------- delen ----------
  function baseUrl() { return location.href.split('#')[0]; }
  function inviteUrl(c) { return baseUrl() + '#' + c; }
  function inviteText(t) { return '☕ Wie haalt er koffie voor ' + t.name + '?\nDoe mee met de koffieloting: ' + inviteUrl(t.code); }
  function listText() {
    var lines = [];
    if (lastDraw) { lines.push('Leukste collega: ' + lastDraw.wname + ' ☕'); lines.push(''); }
    lines.push('Koffielijst' + (room ? ' – ' + room.name : '') + ':');
    presentList().forEach(function (m) { lines.push(m.name + ': ' + m.drink + (m.note ? ' (' + m.note + ')' : '')); });
    return lines.join('\n');
  }
  function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }
  var canShare = typeof navigator.share === 'function';

  function copyText(text, btn, label) {
    function ok() { if (btn) { btn.textContent = 'Gekopieerd ✓'; setTimeout(function () { btn.textContent = label; }, 2000); } }
    try {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    } catch (e) { fallbackCopy(text); ok(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* negeren */ }
    document.body.removeChild(ta);
  }
  function nativeShare(text) { try { navigator.share({ text: text }).catch(function () {}); } catch (e) { /* negeren */ } }

  // ---------- weergave ----------
  function renderAll() { renderLoten(); renderTeam(); }

  // Eén teamlid met schuifje (doet vandaag wel/niet mee). Opmerking staat direct achter de drank.
  function memberRow(m, withRemove) {
    return '<div class="row' + (m.present ? '' : ' off') + '"><div class="who"><b>' + esc(m.name) + (m.pid === pid ? ' (jij)' : '') + '</b><span>' +
      esc(m.drink) + (m.note ? ' (' + esc(m.note) + ')' : '') + '</span>' +
      (withRemove ? '<small>' + (times[m.pid] || 0) + '× gehaald</small>' : (m.present ? '' : '<small>doet vandaag niet mee</small>')) + '</div>' +
      '<button type="button" class="sw' + (m.present ? ' on' : '') + '" data-pid="' + esc(m.pid) + '" role="switch" aria-checked="' + m.present +
      '" aria-label="Doet vandaag mee: ' + esc(m.name) + '"></button>' +
      (withRemove ? '<button type="button" class="x' + (delArm === m.pid ? ' arm' : '') + '" data-del="' + esc(m.pid) + '" aria-label="Verwijder ' + esc(m.name) + ' uit het team">' +
        (delArm === m.pid ? 'Zeker?' : '✕') + '</button>' : '') + '</div>';
  }

  function teamCard() {
    var all = Array.from(members.values());
    var isToday = code === today;
    var h = '<div class="card"><h2>Jouw team</h2>';
    if (teams.length > 1) {
      h += '<div class="tchips" role="group" aria-label="Bekijk een team">' + teams.map(function (t) {
        return '<button type="button" class="tchip' + (t.code === code ? ' cur' : '') + '" data-view="' + esc(t.code) + '" aria-pressed="' + (t.code === code) + '">' +
          esc(t.name) + (t.code === today ? ' · vandaag' : '') + '</button>';
      }).join('') + '</div>';
    } else {
      h += '<p class="teamname">' + esc(room ? room.name : 'Team') + '</p>';
    }
    if (isToday) {
      if (teams.length > 1) h += '<p class="hint">Vandaag doe je mee met dit team. In je andere teams doe je vandaag niet mee.</p>';
    } else {
      var tt = teams.filter(function (t) { return t.code === today; })[0];
      h += '<div class="hint">Je kijkt alleen mee. ' + (tt ? 'Vandaag doe je mee met <b>' + esc(tt.name) + '</b>.' : 'Je doet vandaag nog niet mee.') +
        '<button type="button" class="btn alt small" data-open="' + esc(code) + '">Vandaag meedoen met dit team</button></div>';
    }
    h += '<h3>Wie zitten er in dit team</h3>';
    if (all.length) {
      h += all.map(function (m) { return memberRow(m, false); }).join('') +
        '<p class="muted">Zet de schuif uit als iemand vandaag niet meedoet. Diegene blijft gewoon in het team.</p>';
    } else h += '<p class="muted">Nog niemand. Zet je naam en drankje bij Mijn drinken en nodig collega\'s uit via Team.</p>';
    return h + '</div>';
  }

  function renderLoten() {
    var el = $('lotenBody');
    if (!code) {
      el.innerHTML = '<img class="logo" src="img/loten.png" alt="Wie moet de koffie halen?">' +
        '<p class="sub">Je zit nog niet in een team.</p>' +
        '<button class="btn big" type="button" data-tab="team">Team maken of aansluiten</button>';
      return;
    }
    if (notFound && !members.size) {
      el.innerHTML = '<img class="logo" src="img/loten.png" alt="Wie moet de koffie halen?">' +
        '<p class="sub">Nog geen gegevens gevonden voor dit team.</p>' +
        '<p class="muted" style="text-align:center">Het team is mogelijk al 12 uur niet gebruikt. Vraag een collega die het team al heeft om het te openen, en probeer het daarna opnieuw.</p>' +
        '<button class="btn big" type="button" data-tab="team">Naar Team</button>';
      return;
    }
    var all = Array.from(members.values()), present = presentList();
    var animating = anim && !anim.done;
    var sub = '<p class="sub">' + esc(room ? room.name : 'Team') + ' · ' + present.length + ' van ' + all.length + ' doen mee</p>';
    var btn = '<button class="btn big" type="button" data-act="draw"' + (present.length && !animating ? '' : ' disabled') + '>' +
      (lastDraw ? 'Opnieuw loten' : 'Loot de koffiehaler!') + '</button>';
    var h;
    if (animating) {
      h = sub + '<div class="hero"><div>Wie haalt er koffie…?</div><div class="reel">' + esc(anim.order[anim.i]) + '</div></div>' + btn + teamCard();
    } else if (lastDraw) {
      // Per drank: aantal, en daaronder wie het wil, met de opmerking direct achter de naam
      var groups = {};
      present.forEach(function (m) { (groups[m.drink] = groups[m.drink] || []).push(m); });
      var lines = Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; })
        .map(function (k) {
          return '<li><b>' + groups[k].length + '× ' + esc(k) + '</b><span>' + groups[k].map(function (m) {
            return esc(m.name) + (m.note ? ' (' + esc(m.note) + ')' : '');
          }).join(', ') + '</span></li>';
        }).join('');
      h = sub + '<div class="hero win' + (popNow ? ' pop' : '') + '"><div class="em">🎉</div><div>Vandaag haalt…</div><div class="big">' +
        esc(lastDraw.wname) + '</div><div>koffie!</div></div>' + btn +
        '<div class="card" style="margin-top:12px"><h2>Bestelling</h2><ul class="order">' + lines + '</ul></div>';
      if (present.length) {
        h += '<a class="btn wa small" target="_blank" rel="noopener" href="' + waLink(listText()) + '">Deel bestelling via WhatsApp</a>' +
          '<button class="btn alt small" type="button" data-act="copyList">Kopieer bestelling</button>' +
          (canShare ? '<button class="btn alt small" type="button" data-act="shareList">Deel op een andere manier</button>' : '') +
          '<div style="height:16px"></div>';
      }
      h += teamCard();
    } else {
      h = '<img class="logo" src="img/loten.png" alt="Wie moet de koffie halen?">' + sub + btn;
      if (!present.length) h += '<p class="muted" style="text-align:center">Er doet nog niemand mee.</p>';
      h += '<div style="height:16px"></div>' + teamCard();
    }
    el.innerHTML = h;
  }

  function renderTeam() {
    var h = '';
    if (!teams.length) h = '<p class="muted">Je zit nog niet in een team.</p>';
    else h = teams.map(function (t) {
      var isT = t.code === today, open = menuOpen === t.code;
      return '<div class="trow"><div class="tmain">' +
        '<button type="button" class="radio" role="radio" aria-checked="' + isT + '" data-today="' + esc(t.code) + '" aria-label="Kies ' + esc(t.name) + ' voor vandaag"><i></i></button>' +
        '<div class="tname"><b>' + esc(t.name) + '</b><small class="' + (isT ? 'today' : '') + '">' + (isT ? 'Vandaag meedoen' : 'Doet vandaag niet mee') + '</small></div>' +
        '<button type="button" class="more" data-menu="' + esc(t.code) + '" aria-expanded="' + open + '" aria-haspopup="true">Meer ' + (open ? '▴' : '▾') + '</button></div>' +
        (open ? '<div class="tmenu">' +
          '<a class="btn wa small" target="_blank" rel="noopener" href="' + waLink(inviteText(t)) + '">Uitnodigen via WhatsApp</a>' +
          '<button type="button" class="btn alt small" data-act="copyInvite" data-team="' + esc(t.code) + '">Kopieer link</button>' +
          (canShare ? '<button type="button" class="btn alt small" data-act="shareInvite" data-team="' + esc(t.code) + '">Deel op een andere manier</button>' : '') +
          '<button type="button" class="btn alt small' + '" style="' + (rmArm === t.code ? 'background:#F3D6CF;border-color:#F3D6CF;color:#7A1F10' : '') + '" data-rm="' + esc(t.code) + '">' +
          (rmArm === t.code ? 'Zeker weten? Tik nog eens' : 'Team verwijderen') + '</button></div>' : '') +
        '</div>';
    }).join('');
    $('myTeams').innerHTML = h;

    $('membersCard').hidden = !code;
    if (code) {
      var all = Array.from(members.values());
      $('membersTitle').textContent = 'Leden van ' + (room ? room.name : 'Team') + ' (' + all.length + ')';
      $('memberList').innerHTML = all.length ? all.map(function (m) { return memberRow(m, true); }).join('') :
        '<p class="muted">Nog niemand in dit team.</p>';
    }
  }

  // Mijn drinken: per team een eigen keuze. Wordt alleen opnieuw getekend bij een tabwissel of
  // teamwijziging, zodat het typen niet wordt onderbroken door berichten van collega's.
  function renderDrinks() {
    $('jname').value = profile ? profile.name || '' : $('jname').value;
    if (!teams.length) { $('drinkCards').innerHTML = '<div class="card"><p class="muted">Je zit nog niet in een team. Maak of kies er eerst een bij Team.</p></div>'; return; }
    $('drinkCards').innerHTML = teams.map(function (t) {
      var d = myDrink(t.code), known = DRINKS.indexOf(d.drink) >= 0 && d.drink !== 'Anders';
      var opts = DRINKS.map(function (x) {
        var sel = known ? x === d.drink : x === 'Anders';
        return '<option' + (sel ? ' selected' : '') + '>' + esc(x) + '</option>';
      }).join('');
      var other = known ? '' : (d.drink === 'Anders' ? '' : d.drink);
      return '<div class="card" data-card="' + esc(t.code) + '"><h2>' + esc(t.name) + (t.code === code ? ' <span class="badge">vandaag</span>' : '') + '</h2>' +
        '<label for="dd-' + esc(t.code) + '">Wat wil je drinken?</label>' +
        '<select id="dd-' + esc(t.code) + '" data-dsel="' + esc(t.code) + '">' + opts + '</select>' +
        '<div data-dotherbox="' + esc(t.code) + '"' + (known ? ' hidden' : '') + '><label for="do-' + esc(t.code) + '">Typ wat je wilt hebben</label>' +
        '<input id="do-' + esc(t.code) + '" maxlength="30" value="' + esc(other) + '" placeholder="Bijv: verse muntthee" autocomplete="off"></div>' +
        '<label for="dn-' + esc(t.code) + '">Opmerking (melk, suiker…)</label>' +
        '<input id="dn-' + esc(t.code) + '" maxlength="40" value="' + esc(d.note || '') + '" autocomplete="off">' +
        '<button class="btn small" type="button" data-act="saveDrink" data-team="' + esc(t.code) + '">Opslaan</button>' +
        '<p class="muted" data-dmsg="' + esc(t.code) + '" aria-live="polite"></p></div>';
    }).join('');
  }

  function showTab(t) {
    tab = t;
    ['loten', 'team', 'drinken'].forEach(function (n) { $('tab-' + n).hidden = n !== t; });
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (t === 'drinken') renderDrinks();
    window.scrollTo(0, 0);
  }

  function saveDrink(c) {
    var msg = document.querySelector('[data-dmsg="' + c + '"]');
    if (!profile || !profile.name) { if (msg) msg.textContent = 'Vul eerst bovenaan je naam in en klik op Opslaan.'; return; }
    var sel = $('dd-' + c).value, drink = sel;
    if (sel === 'Anders') drink = clean($('do-' + c).value, 30) || 'Anders';
    var d = { drink: drink, note: clean($('dn-' + c).value, 40) };
    drinks[c] = d; save('kr_drinks', drinks);
    lastDrink = d; save('kr_lastdrink', lastDrink);
    sendToTeam(c, joinEvent(c, c === code));
    if (msg) msg.textContent = 'Opgeslagen ✓ – je collega\'s zien je keuze.';
  }

  // ---------- events van de pagina ----------
  $('nameForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = clean($('jname').value, 30);
    if (!name) return;
    profile = { name: name };
    save('kr_profile', profile);
    teams.forEach(function (t) { sendToTeam(t.code, joinEvent(t.code, t.code === code)); });
    $('nameMsg').textContent = teams.length ? 'Opgeslagen ✓ – je collega\'s zien je naam.' : 'Opgeslagen ✓ – maak of kies nu een team bij Team.';
    renderAll();
  });

  $('newTeam').addEventListener('click', function () {
    var n = clean($('newName').value, 40);
    if (!n) { $('newMsg').textContent = 'Geef het team een naam.'; return; }
    $('newName').value = ''; $('newMsg').textContent = '';
    createTeam(n);
    showTab(profile ? 'loten' : 'drinken');
  });

  $('joinTeam').addEventListener('click', function () {
    var c = parseCode($('joinCode').value);
    if (!c) { $('joinMsg').textContent = 'Dat lijkt geen geldige link of code.'; return; }
    $('joinCode').value = ''; $('joinMsg').textContent = '';
    activateTeam(c);
    showTab(profile ? 'loten' : 'drinken');
  });

  $('drinkCards').addEventListener('change', function (e) {
    var c = e.target.dataset && e.target.dataset.dsel;
    if (!c) return;
    var box = document.querySelector('[data-dotherbox="' + c + '"]');
    box.hidden = e.target.value !== 'Anders';
    if (!box.hidden) $('do-' + c).focus();
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-pid],[data-del],[data-open],[data-rm],[data-tab],[data-view],[data-today],[data-menu]');
    if (!t) return;
    var d = t.dataset;
    if (d.tab) { showTab(d.tab); return; }
    if (d.act === 'draw') doDraw();
    else if (d.act === 'copyList') copyText(listText(), t, t.textContent);
    else if (d.act === 'shareList') nativeShare(listText());
    else if (d.act === 'copyInvite') copyText(inviteUrl(d.team), t, 'Kopieer link');
    else if (d.act === 'shareInvite') nativeShare(inviteText(teams.filter(function (x) { return x.code === d.team; })[0] || { code: d.team, name: 'Team' }));
    else if (d.act === 'saveDrink') saveDrink(d.team);
    else if (d.pid) {
      var m = members.get(d.pid);
      if (m) publish({ k: 'present', pid: m.pid, v: !m.present });
    } else if (d.del) {
      if (delArm === d.del) { publish({ k: 'leave', pid: d.del }); delArm = null; }
      else { delArm = d.del; renderTeam(); setTimeout(function () { if (delArm === d.del) { delArm = null; renderTeam(); } }, 3000); }
    } else if (d.view) {
      if (d.view !== code) openTeam(d.view);
    } else if (d.today) {
      activateTeam(d.today);
    } else if (d.menu) {
      menuOpen = menuOpen === d.menu ? null : d.menu; rmArm = null; renderTeam();
    } else if (d.open) {
      activateTeam(d.open);
    } else if (d.rm) {
      if (rmArm === d.rm) { rmArm = null; removeTeam(d.rm); }
      else { rmArm = d.rm; renderTeam(); setTimeout(function () { if (rmArm === d.rm) { rmArm = null; renderTeam(); } }, 3000); }
    }
  });

  function clearHash() { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* negeren */ } }

  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    if (/^[a-z0-9]{6,20}$/.test(h)) { clearHash(); activateTeam(h); }
  });

  // ---------- start ----------
  // Een link met #code is een uitnodiging: sluit aan en doe vandaag mee. Daarna wissen we de #code,
  // zodat opnieuw openen of herstellen van de app je niet ongemerkt naar dat team terugzet.
  var h0 = location.hash.replace('#', '');
  function known(c) { return c && teams.some(function (t) { return t.code === c; }); }
  if (/^[a-z0-9]{6,20}$/.test(h0)) { clearHash(); activateTeam(h0); }
  else if (known(today)) openTeam(today);
  else if (known(active)) openTeam(active);
  else if (teams.length) openTeam(teams[0].code);
  else renderAll();
  if (profile && profile.name) showTab('loten'); else showTab(teams.length || code ? 'drinken' : 'loten');
})();
</script>
</body>
</html>
